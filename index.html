<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tủ Yên - Blog cá nhân</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
    :root {
      --bg: #fef9f2;
      --text: #333;
      --accent: #6b9080;
      --accent-light: #a4c3a2;
      --card: #fff;
      --shadow: rgba(107, 144, 128, 0.15);
    }
    body { background: var(--bg); color: var(--text); line-height: 1.8; padding: 20px; max-width: 900px; margin: 0 auto; }
    header { text-align: center; padding: 40px 20px; border-bottom: 1px solid var(--accent-light); margin-bottom: 40px; }
    .site-title { font-size: 2.2rem; color: var(--accent); margin-bottom: 8px; }
    .site-slogan { color: #777; font-style: italic; }
    .filter-bar { text-align: center; margin-bottom: 30px; }
    .filter-btn {
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
      padding: 6px 16px; margin: 4px; border-radius: 20px; cursor: pointer; transition: 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--accent); color: white; }
    .search-box { text-align: center; margin-bottom: 30px; }
    #search-input {
      padding: 10px 16px; width: 100%; max-width: 400px; border: 1px solid var(--accent-light);
      border-radius: 25px; font-size: 1rem; background: white;
    }
    .posts-container { display: flex; flex-direction: column; gap: 30px; }
    .post-card {
      background: var(--card); border-radius: 12px; padding: 25px; box-shadow: 0 4px 12px var(--shadow);
      transition: transform 0.2s;
    }
    .post-card:hover { transform: translateY(-3px); }
    .post-card.featured { border-left: 4px solid var(--accent); }
    .post-image { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 18px; display: none; }
    .post-image.show { display: block; }
    .post-title { font-size: 1.4rem; color: var(--accent); margin-bottom: 8px; }
    .post-meta { font-size: 0.9rem; color: #888; margin-bottom: 15px; }
    .post-excerpt { color: #555; margin-bottom: 15px; }
    .post-full { display: none; white-space: pre-line; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--accent-light); }
    .post-full.show { display: block; }
    .read-more {
      background: transparent; border: none; color: var(--accent); cursor: pointer;
      font-weight: 600; padding: 5px 0;
    }
    .read-more:hover { text-decoration: underline; }
    .author-section {
      margin-top: 60px; padding: 30px; background: white; border-radius: 12px; text-align: center;
    }
    .author-name { font-size: 1.3rem; color: var(--accent); margin-bottom: 10px; }
    footer { text-align: center; margin-top: 60px; padding: 20px; color: #888; font-size: 0.9rem; }
    .empty-state { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1 class="site-title">Tủ Yên</h1>
    <p class="site-slogan">Nơi những nỗi niềm được chắp cánh</p>
  </header>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Tìm bài viết...">
  </div>

  <div class="filter-bar" id="filter-container"></div>
  <div class="posts-container" id="posts-container"></div>

  <section class="author-section">
    <h3 class="author-name">Tác giả</h3>
    <p>Người con xa quê, luôn mang trong mình nỗi nhớ về quê hương và những bình dị ngày thơ. Viết để lưu giữ, để chia sẻ, để tìm lại một phần chính mình trong từng câu chữ.</p>
  </section>

  <footer>
    <p>© 2025 Tủ Yên — Giữ gìn những nét đẹp quê hương</p>
  </footer>

  <script>
    // ===== DANH SÁCH CHUYÊN MỤC =====
    const categories = {
      all: { label: 'Tất cả', color: '#6b9080' },
      tanvan: { label: 'Tản văn', color: '#6b9080' },
      doisong: { label: 'Đời sống', color: '#8fa874' },
      tuybut: { label: 'Tùy bút', color: '#b4a76c' },
      suynghi: { label: 'Suy nghĩ', color: '#d4a574' },
      reviewsach: { label: 'Review sách', color: '#a491c2' },
      dulich: { label: 'Du lịch', color: '#7fb3d5' }
    };

    // ===== DANH SÁCH BÀI VIẾT =====
    const posts = [
      {
        cat: 'tanvan',
        title: 'Hừng đông ló rạng',
        date: '19.10.2026',
        read: '4 phút đọc',
        featured: true,
        image: '',
        excerpt: 'Thời đại nhà nhà tân tiến, người người hướng đến giá trị văn minh, những người trẻ mang trong mình hoài bão lớn lao, ai cũng mong muốn được thoát xác, đi đến những chân trời mới lạ để định vị bản thân.',
        full: `Bị đánh thức bởi tiếng kêu của mẹ, tôi gắng gượng bước khỏi giường khi mặt trời còn "đang ngủ", thẫn thờ bước ra nhà sau với vẻ mặt ngái ngủ. Hôm nay, ba cũng đi làm từ sớm nên tôi thay phần ba phụ mẹ nấu bún riêu và đẩy xe ra chợ bán.

Cái nghề này nuôi sống gia đình tôi áng chừng chỉ khoảng 10 năm nay. Trước đó, mẹ cũng buôn bán nhưng là những mặt hàng làm đỡ cực hơn như xôi vò, chuối nướng, chè, sâm… Có một khoảng thời gian, ba mẹ theo bà con đi làm ăn xa đến khi quay về thì người khác đã dành hết mối. Mẹ học nấu bún riêu và bám trụ đến bây giờ. Năm ngoái, còn bày thêm bún cá nhưng thấy cực quá nên tôi bảo nghỉ, bán một món thôi cho đỡ cực.

Chuông báo thức reo 3 giờ 30 sáng, đều đặn mỗi ngày thay cho tiếng gà đánh thức mẹ dậy bắt tay vào việc. Chủ yếu là công đoạn nấu nước lèo, cân đo đong đếm để nêm nếm cho đúng khẩu vị như thường lệ. Hồi đó, trước nhà có cô kia bán cháo lòng nhưng tùy hứng lắm. Hôm nào rộng rãi thì cho nhiều đường, muối, bột ngọt, hạt nêm. Khi nào không vui thì nêm ít đi một chút. Nói chung là theo kiểu "nghe ông bà mách bảo là vừa miệng". Mẹ không thích như vậy, hay nói "bán buôn là cái nghề nuôi sống mình nên phải làm ăn cho đàng hoàng. Mình nêm đúng như khẩu vị mà khách khen thì người ta mới quay lại ăn nhiều lần". Một phần vì chủ yếu bán cho dân cư ở chợ và xung quanh khu vực gần nhà nên bà cũng sợ… mang tiếng.

Các công đoạn khác như lặt rau thơm, bào rau muống, phi hành, khử mắm… đã được hoàn tất trong chiều ngày hôm trước. Mỗi chiều tà khi ánh mặt trời còn lấp ló phía xa xa chưa lặn hẳn, phóng tầm mắt ra hướng đồng ruộng thấy một màu hoàng hôn đẹp như tranh vẽ, làn khói từ chái bếp cũng ham chơi, len lỏi vào thiên nhiên tạo nên bức tranh miền quê yên bình đến lạ. Đó là làn khói từ nồi huyết mẹ đang luộc để loại bỏ mùi hôi trước khi cho vào nồi nước lèo sáng sớm. Nhớ hồi nhỏ có lần tôi ăn hủ tiếu ở quán nọ, ăn phải huyết chưa được chế biến kỹ lưỡng. Về nhà, tôi ói mật xanh mật vàng và sợ luôn món này. Mãi về sau, đến khi mẹ tôi mở xe bán bún, tôi mới dám thử lại.

Mẹ hoàn tất các khâu, tôi mới có việc để làm – đẩy xe vào khu chợ. Hình như chỉ có việc này mẹ mới nhờ vả đến ba hoặc tôi vì hồi mới về nhà nội, mẹ trèo thang để lau dọn nhà dịp Tết, bị ngã gãy tay nên có tỳ. Một lần, mẹ giận ba nên tự đẩy xe, đi đường trường còn đỡ nhưng để lên dốc thì cần phải dùng lực mạnh, mẹ bị nhức ngay vết thương cũ. Từ đó về sau, có giận dỗi hay như thế nào cũng ráng xuống nước để đỡ khổ thân.

Quen với nhịp sống đô thị, tôi bất giác ngỡ ngàng khi chưa được 5 giờ sáng mà đường xá đã tấp nập người và xe cộ. Thậm chí còn đông hơn cả khi mặt trời phủ sáng toàn diện. Người thì đẩy xe giống mẹ con tôi, người khệ nệ khuân vác bàn ghế dọn hàng, cô kia chặt thịt heo nghe lụp cụp, chú nọ khiêng thùng cá mới lấy về từ chợ đầu mối, tiếng máy rao hàng, tiếng còi xe, tiếng người chào hỏi luyên thuyên… làm huyên náo cả một vùng quê.

Ở quê người ta họp chợ sớm. Họ bắt đầu lúc hừng đông chưa ló dạng, không thấy rõ mặt người và kết thúc khi ông trời vừa bừng tỉnh dậy. Ai ở thành phố về quen giấc ngủ đến 7, 8 giờ thì xác định ôm bụng đói mà chạy ra chợ lớn mới có đồ ăn.

Thấm thoát đã hết ngày về phép, tôi lại tất bật chuẩn bị để trở lại với cuộc sống cơm áo gạo tiền nơi đất khách. Ở đó phát triển hơn, có đầy đủ mọi thứ nhưng tìm mãi vẫn không thấy được một thoáng hương quê. Thế nên sau này mỗi khi có dịp về quê, tôi lại cố tình dậy sớm để hòa vào nhịp sống đồng bằng, cảm nhận khí trời mát mẻ của buổi bình minh và thả mình vào không gian đầy ồn ào trong buổi trà đạo của các ông, các bà.

"Người bỏ quê hương, chứ bao giờ quê hương bỏ người". Thời đại nhà nhà tân tiến, người người hướng đến giá trị văn minh, những người trẻ mang trong mình hoài bão lớn lao, ai cũng mong muốn được thoát xác, đi đến những chân trời mới lạ để định vị bản thân. Có khi bị cuống vào vòng quay của hào nhoáng, xa hoa, ta trót lỡ đôi lần không còn nhớ đến nơi chôn rau cắt rốn. Nhưng chỉ có người bỏ đất, chứ đất bỏ người sao được. Nhà vẫn ở đấy, đợi ta quay về mỗi khi mỏi mệt.`
      }
    ];

    // ===== KHỞI TẠO =====
    let currentFilter = 'all';
    let searchTerm = '';

    function renderFilters() {
      const container = document.getElementById('filter-container');
      container.innerHTML = '';
      Object.entries(categories).forEach(([key, val]) => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${currentFilter === key ? 'active' : ''}`;
        btn.dataset.filter = key;
        btn.textContent = val.label;
        btn.onclick = () => { currentFilter = key; renderAll(); };
        container.appendChild(btn);
      });
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';
      
      let filtered = posts.filter(p => {
        const matchCat = currentFilter === 'all' || p.cat === currentFilter;
        const text = `${p.title} ${p.excerpt} ${p.full}`.toLowerCase();
        const matchSearch = searchTerm === '' || text.includes(searchTerm.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="empty-state">Chưa có bài viết nào phù hợp.</p>';
        return;
      }

      filtered.forEach(post => {
        const card = document.createElement('article');
        card.className = `post-card ${post.featured ? 'featured' : ''}`;
        
        card.innerHTML = `
          ${post.image ? `<img src="${post.image}" alt="${post.title}" class="post-image show">` : ''}
          <h2 class="post-title">${post.title}</h2>
          <p class="post-meta">${post.date} · ${post.read}</p>
          <p class="post-excerpt">${post.excerpt}</p>
          <button class="read-more">Đọc tiếp →</button>
          <div class="post-full">${post.full}</div>
        `;
        
        const btn = card.querySelector('.read-more');
        const full = card.querySelector('.post-full');
        let expanded = false;
        btn.onclick = () => {
          expanded = !expanded;
          full.classList.toggle('show', expanded);
          btn.textContent = expanded ? 'Thu gọn ↑' : 'Đọc tiếp →';
        };
        
        container.appendChild(card);
      });
    }

    function renderAll() {
      renderFilters();
      renderPosts();
    }

    document.getElementById('search-input').addEventListener('input', e => {
      searchTerm = e.target.value;
      renderPosts();
    });

    renderAll();
  </script>
</body>
</html>
